name: 前端自动部署（本地打包 + Docker 运行）

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装 Node（必须！）
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. 本地打包（生成 dist —— 最关键！）
      - name: 安装依赖 + 打包
        run: |
          npm ci
          npm run build

      # 3. 上传代码 + dist 到服务器
      - name: 上传文件到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          source: '.'
          target: ${{ secrets.SERVER_PATH }}

      # 4. 服务器构建 + 启动
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            cd ${{ secrets.SERVER_PATH }}

            # 停止旧容器
            docker stop frontend || true
            docker rm frontend || true

            # 构建镜像（此时已经有 dist 了）
            docker build -t frontend:latest .

            # 启动（80端口直接访问）
            docker run -d \
              --name frontend \
              --restart always \
              -p 80:80 \
              frontend:latest
