name: Docker 前端自动部署

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 在 GitHub Actions 里构建镜像
      - name: 构建 Docker 镜像
        run: docker build -t frontend:latest .

      # 保存镜像为 tar 文件
      - name: 保存镜像
        run: docker save frontend:latest > frontend.tar

      # 传到服务器并启动
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            cd ${{ secrets.SERVER_PATH }}

            # 停止旧容器
            docker stop frontend || true
            docker rm frontend || true

            # 加载新镜像（从 GitHub 传来的 tar）
            docker load < frontend.tar

            # 启动容器
            docker run -d \
              --name frontend \
              --restart always \
              -p 5173:80 \
              frontend:latest
